<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - Registro</title>
    <link rel="stylesheet" href="../../css/stylesApp.css" />
    <script src="../../index.js"></script>
    <script src="../../js/scriptsApp.js"></script>
    <script src="../../js/registro-productos.js"></script>
</head>
<body>
    <div id="navApp"></div>
    <main class="container-modulos">
        <div class="modulos-titulo">
            <h2>Agregar</h2>
        </div>
        <div class="botonesRegistro">
            <div>
                <a href="../panel.html"><button class="boton-modulos">Módulos</button></a>
            </div>
            <div>
                <a href="./lista-productos.html"><button class="boton-agregar">Productos</button></a>
            </div>
        </div>
        <!-- *FORMULARIO PRODUCTOS -->
        <form id="createProductoForm" enctype="multipart/form-data" class="container-form d-flex justify-content-center flex-column col-md-7">
            <div class="row">
                <div class="form-group col-md-6 mb-3">
                    <label for="nombre_producto">Nombre</label>
                    <input type="text" name="nombre_producto" id="nombre_producto" class="form-control" placeholder="Nombre producto">
                </div>
                <div class="form-group col-md-6 mb-3">
                    <label for="categoria">Categoría</label>
                    <select name="id_categoria" id="categoria" class="form-control">
                        <option value="" disabled selected>Seleccionar</option>
                        <!-- Opciones de categorías se pueden cargar dinámicamente -->
                    </select>
                </div>
                <div class="form-group col-md-6 mb-3">
                    <label for="relleno">Relleno</label>
                    <select name="id_relleno" id="relleno" class="form-control">
                        <option value="" disabled selected>Seleccionar</option>
                        <!-- Opciones de rellenos se pueden cargar dinámicamente -->
                    </select>
                </div>
                <div class="form-group col-md-6 mb-3">
                    <label for="porcion">Porciones</label>
                    <select name="id_porcion" id="porcion" class="form-control">
                        <option value="" disabled selected>Seleccionar</option>
                        <!-- Opciones de porciones se pueden cargar dinámicamente -->
                    </select>
                </div>
                <div class="form-group col-md-6 mb-3">
                    <label for="precio_producto">Precio</label>
                    <input type="number" name="precio_producto" id="precio_producto" class="form-control" placeholder="Precio">
                </div>
                <div class="form-group col-md-6 mb-3">
                    <label for="estado_producto">Disponibilidad</label>
                    <select name="estado_producto" id="estado_producto" class="form-control">
                        <option value="" disabled selected>Seleccionar</option>
                        <option value="true">Disponible</option>
                        <option value="false">Agotado</option>
                    </select>
                </div>
                <div class="form-group col-md-12 mb-3">
                    <label for="descripcion_producto">Descripción</label>
                    <textarea name="descripcion_producto" id="descripcion_producto" class="form-control" placeholder="Descripción del producto" rows="5"></textarea>
                </div>
                <div class="form-group col-md-6 mb-3">
                    <label for="imagen_producto">Imagen</label>
                    <input type="file" name="file" id="imagen_producto" class="form-control-file">
                </div>
                <div class="col-lg-12 mt-5">
                    <button type="submit" class="btn btn-success" id="botonAgregar">Agregar</button>
                    <button type="button" class="btn btn-primary" id="botonModificar">Actualizar</button>
                </div>
            </div>
        </form>
    </main>
    <script src="api-productos.js"></script>
</body>
</html>
