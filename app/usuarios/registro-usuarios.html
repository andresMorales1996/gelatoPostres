<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - Registro</title>
    <link rel="stylesheet" href="../../css/stylesApp.css" />
    <script src="../../index.js"></script>
    <script src="../../js/scriptsApp.js"></script>
    <script src="../../js/registro-productos.js"></script>
</head>
<body>
    <div id="navApp"></div>
    <main class="container-modulos">
        <div class="modulos-titulo">
            <h2>Agregar</h2>
        </div>
        <div class="botonesRegistro">
            <div>
                <a href="../panel.html"><button class="boton-modulos">Módulos</button></a>
            </div>
            <div>
                <a href="./lista-usuarios.html"><button class="boton-agregar">Usuarios</button></a>
            </div>
        </div>
        <!-- *FORMULARIO USUARIOS -->
        <form id="createUsuariosForm" class="container-form d-flex justify-content-center flex-column col-md-7">
            <div class="row">
                <div class="form-group col-md-6 mb-3">
                    <label for="nombre_usuario">Nombre</label>
                    <input type="text" name="nombre_usuario" id="nombre_usuario" class="form-control" placeholder="Nombre producto">
                </div>
                <div class="form-group col-md-6 mb-3">
                    <label for="genero_usuario">Género</label>
                    <select name="genero_usuario.id" id="genero_usuario" class="form-control" placeholder="Género">
                        <option value="" disabled selected>Seleccionar</option>
                        <option value="" hombre>Hombre</option>
                        <option value="" mujer>Mujer</option>
                    </select>
                </div>                
                <div class="form-group col-md-6 mb-3">
                    <label for="telefono_usuario">Teléfono</label>
                    <input type="tel" name="telefono_usuario" id="telefono_usuario" class="form-control" placeholder="+57-300-0000">
                </div>
                <div class="form-group col-md-6 mb-3">
                    <label for="email_usuario">Correo</label>
                    <input type="email_usuario" name="email_usuario" id="email_usuario" class="form-control" placeholder="Agrega correo">
                </div>
                <div class="form-group col-md-6 mb-3">
                    <label for="contrasena_usuario">Contraseña</label>
                    <input type="password" name="contrasena_usuario" id="contrasena_usuario" class="form-control" placeholder="Escribe contraseña">
                </div>
                <!-- <div class="form-group col-md-6 mb-3">
                    <label for="imagen_usuario">Imagen</label>
                    <input type="file" name="imagen_usuario" id="imagen_usuario" class="form-control-file">
                </div> -->
                <div class="col-lg-12 mt-5">
                    <button type="submit" class="btn btn-success" id="botonAgregar">Agregar</button>
                    <button type="button" class="btn btn-primary" id="botonModificar">Actualizar</button>
                </div>
            </div>
        </form>
    </main>

    <script>
        cargarScripts("listaApp");
        
    </script>
    <script src="./api-productos.js"></script>

</body>

</html>
