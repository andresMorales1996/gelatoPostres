<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Usuario</title>
    <link rel="stylesheet" href="../../css/stylesApp.css">
    <script src="../../index.js"></script>
    <script src="../../js/scriptsApp.js"></script>
</head>
<body>
    <div id="navApp"></div>

    <main class="container-modulos">
        
        <div class="modulos-titulo">
            <h2>Editar</h2>
        </div>

        <!-- *FORMULARIO USUARIOS -->
        <form id="editarUsuarioForm" class="container-form d-flex justify-content-center flex-column col-md-7">
            <div class="row">
                <div class="form-group col-md-6 mb-3">
                    <label for="nombre_usuario">Nombre de usuario</label>
                    <input type="text" name="nombre_usuario" id="nombre_usuario" class="form-control" placeholder="Nombre usuario">
                </div>
                <div class="form-group col-md-6 mb-3">
                    <label for="genero_usuario">Género</label>
                    <select name="genero_usuario" id="genero_usuario" class="form-control">
                        <option value="" disabled selected>Seleccionar</option>
                        <option value="hombre">Hombre</option>
                        <option value="mujer">Mujer</option>
                    </select>
                </div>
                <div class="form-group col-md-6 mb-3">
                    <label for="telefono_usuario">Teléfono</label>
                    <input type="tel" name="telefono_usuario" id="telefono_usuario" class="form-control" placeholder="+57-300-0000">
                </div>
                <div class="form-group col-md-6 mb-3">
                    <label for="email_usuario">Correo</label>
                    <input type="email" name="email_usuario" id="email_usuario" class="form-control" placeholder="Agrega correo">
                </div>
                <div class="form-group col-md-6 mb-3">
                    <label for="contrasena_usuario">Contraseña</label>
                    <input type="password" name="contrasena_usuario" id="contrasena_usuario" class="form-control" placeholder="Escribe contraseña">
                </div>
                <!--
                <div class="form-group col-md-6 mb-3">
                    <label for="imagen_usuario">Imagen</label>
                    <input type="file" name="imagen_usuario" id="imagen_usuario" class="form-control-file">
                </div>
                -->
                <div class="col-lg-12 mt-5">
                    <button type="button" class="btn btn-primary" id="botonActualizar">Actualizar</button>
                </div>
            </div>
        </form>
    </main>

    <script>
        cargarScripts("listaApp");        
    </script>
    <script src="./api-usuarios.js"></script>
</body>
</html>
