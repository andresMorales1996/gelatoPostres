<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coberturas - Registro</title>
    <link rel="stylesheet" href="../../css/stylesApp.css" />
    <script src="../../index.js"></script>
    <script src="../../js/scriptsApp.js"></script>
    <script src="../../js/registro-productos.js"></script>
</head>
<body>
    <div id="navApp"></div>
    <main class="container-modulos">
        <div class="modulos-titulo">
            <h2>Agregar</h2>
        </div>
        <div class="botonesRegistro">
            <div>
                  <a href="../panel.html"><button class="boton-modulos">Módulos</button></a>
            </div>
            <div>
                <a href="./lista-coberturas.html"><button class="boton-agregar btn-ag">Coberturas</button></a>
            </div>
        </div>
        <!-- *FORMULARIO COBERTURAS -->
        <form id="createCoberturaForm" class="container-form d-flex justify-content-center flex-column col-md-7">
            <div class="row">
                <div class="form-group col-md-6 mb-3 agregar">
                    <label for="nombre_cobertura">Nombre de cobertura</label>
                    <input type="text" name="nombre_cobertura" id="nombre_cobertura" class="form-control" placeholder="Nombre cobertura">
                </div>
                <div class="form-group col-md-6 mb-3">
                    <label for="precio_cobertura">Precio</label>
                    <input type="number" name="precio_cobertura" id="precio_cobertura" class="form-control" placeholder="Precio">
                </div>
                <div class="col-lg-12 mt-5">
                    <button type="submit" class="btn btn-success" id="botonAgregar">Agregar</button>
                    <button type="button" class="btn btn-primary" id="botonModificar">Actualizar</button>
                </div>
            </div>
        </form>
    </main>

    <script>
        cargarScripts("listaApp");
        
    </script>
    <script src="./api-coberturas.js"></script>

</body>

</html>
