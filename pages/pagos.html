<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/pagos.css" />
    <script src="../index.js"></script>
    <script src="../js/scripts.js"></script>
    <title>Pagos</title>
  </head>
  <body>
    <div id="nav"></div>

    <h1 class="titulo-pagos">Pasarela de pagos</h1>
    <section class="pago_section">
      <div class="container">
        <div class="pago-wrapper">
          <div class="resumen-compra">
            <div class="nav-resumen">
              <h3>Resumen compra</h3>
              <a href="../pages/carrito.html" class="editar">Editar carrito</a>
            </div>
            <div id="items">
            </div>
            <div class="totales">
              <p class="subtotal">Artículos <span id="subtotal">$ 0.00</span></p>
              <p class="envio">Envío Gratis<span>$ 0.00</span></p>
              <p class="total">Total <span id="total">$ 0.00</span></p>
            </div>
          </div>
          <div class="metodo-pago">
            <h3>Seleccione un método de pago</h3>
            <div class="metodos">
                <img src="../assets/svg/bank.svg" alt="Banco" />
                <img src="../assets/svg/cc-mastercard.svg" alt="PayPal" />
                <img src="../assets/svg/paypal.svg" alt="paypal" />
                <img src="../assets/svg/apple-pay.svg" alt="apple-pay" />
                <img src="../assets/svg/mercado-pago.svg" alt="mercado-pago" />
            </div>
            <form>
              <div class="campo">
                <label for="email">Correo Electrónico<span>*</span</label>
                <input type="email" id="email" required />
              </div>
              <div class="campo">
                <label for="cc">Identificación<span>*</span></label>
                <input type="text" id="cc" name="cc" required />
              </div>
              <div class="campo">
                  <label for="nombre">Nombre<span>*</span </label>
                  <input type="text" id="nombre" name="nombre" required />
              </div>
              <div class="campo">
                <label for="apellido">Apellido<span>*</span</label>
                <input type="text" id="apellido" name="apellido" required />
              </div>
              <div class="campo">
                <label for="telefono">Teléfono<span>*</span</label>
                <input type="number" id="telefono" name="telefono" required />
              </div>
              <div class="campo-check">
                <input
                  type="checkbox"
                  id="guardar-datos"
                  name="guardar-datos"
                />
                <label for="guardar-datos"
                  >Guardar datos para futuras compras</label
                >
              </div>
              <button type="submit" class="confirmar">Confirmar</button>
              <button type="submit" class="cancelar">Cancelar</button>
            </form>
          </div>
        </div>
      </div>
    </section>

    <div id="whatsapp"></div>

    <div id="footer"></div>
    <script>
      cargarScripts("pagos");
    </script>
    <!--Script pagos-->
    <script src="../js/pagos.js"></script>
  </body>
</html>
